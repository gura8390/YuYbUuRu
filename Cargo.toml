[package]
name = "yuybuuru"
version = "0.4.2"
edition = "2024"
description = "Offline Qwen3-ASR dictation, hotwords and file transcription"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libloading = "0.8"
regex = "1"
fancy-regex = "0.16"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24", "half"] }
rustfft = "6"
memmap2 = "0.9"
half = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_ProcessStatus", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
